name: Build Check (gcc -Wall -Wextra -Werror)

on:
  push:
    paths:
      - 'teams/**'
  pull_request:
    paths:
      - 'teams/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc
        
      - name: Fetch base commit for diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Detect changed teams
        id: detect
        run: |
          echo "CHANGED_DIRS=$(git diff --name-only origin/master...HEAD \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)" >> $GITHUB_ENV

      - name: Compile changed teams
        run: |
          for DIR in $CHANGED_DIRS; do
            echo "Compiling $DIR"
            mkdir -p $DIR/output_CI
            gcc -Wall -Wextra -Werror -o $DIR/a.out $DIR/*.c > $DIR/output_CI/build.log 2>&1
            if [ $? -ne 0 ]; then
              echo "Compilation failed in $DIR"
              cat $DIR/output_CI/build.log
              exit 1
            fi
          done

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-logs-${{ github.run_number }}
          path: teams/**/output_CI/*.log
