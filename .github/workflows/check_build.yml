name: Build Check (gcc -Wall -Wextra -Werror)

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Detect changed teams
        id: detect
        run: |
          echo "CHANGED_DIRS=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)" >> $GITHUB_ENV

      - name: Compile changed teams
        run: |
          for DIR in $CHANGED_DIRS; do
            echo "🛠 Compiling $DIR"
            mkdir -p $DIR/output_CI
            gcc -Wall -Wextra -Werror -o $DIR/a.out $DIR/*.c 2>&1 | tee $DIR/output_CI/build.log
          done

          - name: Upload logs
            uses: actions/upload-artifact@v3
            with:
            name: ${{ github.job }}-logs-${{ github.run_number }}
            path: output_CI/${{ github.run_number }}/*.log
