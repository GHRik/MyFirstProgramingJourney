name: Build Check (gcc -Wall -Wextra -Werror)

on:
  push:
    paths:
      - 'teams/**'
  pull_request:
    paths:
      - 'teams/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Fetch base commit for diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Detect changed teams
        id: detect
        run: |
          echo "CHANGED_DIRS=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)" >> $GITHUB_ENV

      - name: Detect changed teams
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=$(git rev-parse HEAD^)
            HEAD=$(git rev-parse HEAD)
          fi

          echo "Diffing: $BASE -> $HEAD"

          CHANGED_DIRS=$(git diff --name-only $BASE $HEAD \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)

          echo "CHANGED_DIRS=$CHANGED_DIRS" >> $GITHUB_ENV
          echo "Changed dirs: $CHANGED_DIRS"


      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-logs-${{ github.run_number }}
          path: teams/**/output_CI/*.log
