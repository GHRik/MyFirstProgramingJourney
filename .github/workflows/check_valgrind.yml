name: Valgrind Check

on:
  push:
    paths:
      - 'teams/**'
  pull_request:
    paths:
      - 'teams/**'

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y gcc valgrind

      - name: Detect changed teams
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=$(git rev-parse HEAD^)
            HEAD=$(git rev-parse HEAD)
          fi

          echo "🔍 Diffing: $BASE -> $HEAD"

          CHANGED_DIRS=$(git diff --name-only $BASE $HEAD \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)

          echo "CHANGED_DIRS=$CHANGED_DIRS" >> $GITHUB_ENV
          echo "📂 Changed dirs: $CHANGED_DIRS"

      - name: Run Valgrind on built binaries
        run: |
          for DIR in $CHANGED_DIRS; do
            echo "🔍 Running valgrind in $DIR"
            mkdir -p $DIR/output_CI  # <- upewnij się, że katalog istnieje

            valgrind --leak-check=full --error-exitcode=1 $DIR/a.out < $DIR/test_input.txt 2>&1 | tee $DIR/output_CI/valgrind.log
            STATUS=${PIPESTATUS[0]}
            if [ $STATUS -ne 0 ]; then
              echo "❌ Valgrind failed in $DIR"
              exit $STATUS
            fi
          done

      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-logs-${{ github.run_number }}
          path: teams/**/output_CI/*.log
