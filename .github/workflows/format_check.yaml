name: Format Check (clang-format)

on: [pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Detect changed teams
        id: detect
        run: |
          echo "CHANGED_DIRS=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
            | grep '^teams/' | cut -d/ -f1-2 | sort -u)" >> $GITHUB_ENV

      - name: Run clang-format
        run: |
          for DIR in $CHANGED_DIRS; do
            echo "🔧 Checking format in $DIR"
            FILES=$(find $DIR -name "*.c" -o -name "*.h")
            mkdir -p $DIR/output_CI
            clang-format --dry-run --Werror $FILES 2>&1 | tee $DIR/output_CI/format.log
          done

          - name: Upload logs
            uses: actions/upload-artifact@v3
            with:
              name: ${{ github.job }}-logs-${{ github.run_number }}
              path: output_CI/${{ github.run_number }}/*.log
